<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Session Storage example</h2>
    <p id="demo"></p>
    <script>
        sessionStorage.setItem("Language","Python");
        let name = sessionStorage.getItem("Language");
            document.getElementById("demo").textContent="My favourite Language is " + name + ".";
    </script>
    
</body>
</html>
