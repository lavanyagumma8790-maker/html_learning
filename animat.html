<!DOCTYPE html>
<html>
<head>
<style>

.box {
    width: 100px;
    height: 100px;
    background-color: red;
    animation-name: move;
    animation-duration: 3s;
}

@keyframes move {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(300px);
    }
}

</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
