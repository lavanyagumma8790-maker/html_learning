<!DOCTYPE html>
<html>
<head>
<style>
.box{
width:100px;
height:100px;
background-color:green;
padding:25px;
animation-name:move;
animation-duration:3s;
animation-iteration-count:infinite;
animation-delay:2s;
animation-direction:alternate;
}
@keyframes move{
from{
transform:translate(0)
}
to{
transform:translate(300px)
}
}
</style>
</head>
<body>
<div class="box">Lavanya</div>
</body>
</html>
