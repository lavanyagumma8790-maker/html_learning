
<!DOCTYPE html>
<html>
<body>
  <input id="name" placeholder="Enter your name">
  <p id="demo"></p>

  <script>
    const input = document.getElementById("name");
    const para = document.getElementById("demo");

    input.addEventListener("input", function() {
      para.textContent = input.value;
    });
  </script>
</body>
</html>
