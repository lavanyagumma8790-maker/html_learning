<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="demo">Welcome to My website</h1>
    <p id="demp1">I ma learning Javascript Dom</p>
    <button id="btn">Change content</button>
    <script>
        let head = document.getElementById("demo");
        let para = document.getElementById("demp1");
        let button1 = document.getElementById("btn");
            button1.addEventListener("click",function(){
              head.textContent="Dom Manipulation Compelted";  
              para.textContent="I can Modify Html code Using Javascript";
              para.style.color="green";
            })

    </script>
    
</body>
</html>
