<!DOCTYPE html>
<html>
<head>
<style>
table, th, td {
  border: 3px solid black;
}
</style>
</head>
<body>

<h2>Table With Border</h2>

<p>Use the CSS border property to add a border to the table.</p>

<table style="width:100%">
  <tr>
    <th>name</th>
    <th>age</th> 
    <th>marks</th>
  </tr>
  <tr>
    <td>lavanya</td>
    <td>20</td>
    <td>50</td>
  </tr>
  <tr>
    <td>pavani</td>
    <td>19</td>
    <td>94</td>
  </tr>
  <tr>
    <td>pavan</td>
    <td>16</td>
    <td>80</td>
  </tr>
</table>

</body>
</html>
